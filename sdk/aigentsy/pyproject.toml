[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aigentsy"
version = "1.16.0"
description = "ProofPack creation, offline verification, acceptance-gated settlement coordination, and SDK primitives for agent commerce."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "AiGentsy", email = "admin@aigentsy.com" },
]
keywords = [
    "aigentsy", "settlement", "proof", "agent", "protocol",
    "verification", "ai", "merkle", "transparency-log",
    "attestation", "credential", "webhook", "staking", "netting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
]

[project.scripts]
aigentsy = "aigentsy.cli:main"

[project.optional-dependencies]
# Pin the offline verifier to the current PUBLIC PyPI release (1.5.0), which
# reports passed vs skipped checks honestly — the behavior gate_and_prove relies
# on. (The in-repo sdk/verify source mirror is a stale 1.2.1 checkout; always
# rely on the pip-installed aigentsy-verify. See README "Verifier version".)
verify = ["aigentsy-verify>=1.5.0"]
langgraph = ["aigentsy-langgraph>=0.1"]
langchain = ["langchain-core>=0.1"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://aigentsy.com"
Repository = "https://github.com/AiGentsyProtocol/AiGentsy-Protocol"
Documentation = "https://aigentsy.com/data/protocol_docs.md"
Quickstart = "https://aigentsy.com/quickstart"
"Trust Center" = "https://aigentsy.com/trust"

[tool.hatch.build.targets.wheel]
packages = ["src/aigentsy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
